<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<!--
  viewport-fit=cover: a kivagott (notch) telefonokon a jatek a teljes
  kepernyot hasznalja, a gombok pedig a safe-area-n belul maradnak.
  user-scalable=no: egy jatekban a ket ujjas nagyitas csak zavar.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DŐL A FA v4 - mobil</title>
<meta name="theme-color" content="#0a0806">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!--
  Kezdokepernyore teve alkalmazaskent, fekve es teljes kepernyon indul.
  iPhone-on ez az egyetlen ut a teljes kepernyohoz, mert a Safari egy sima
  weboldalnak nem adja meg.
-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DŐL A FA">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
  </div>

  <!-- Erintes-reteg: a ket terfel es a ket lebego konzol. Csak erintokepernyon
       latszik, a szkript kapcsolja be. -->
  <div id="erintes" aria-hidden="true">
    <div class="zona bal"></div>
    <div class="zona jobb"></div>
    <div class="bot" id="bot0"><div class="talp"></div><div class="fej"></div></div>
    <div class="bot" id="bot1"><div class="talp"></div><div class="fej"></div></div>
  </div>

  <!-- Kulon gombsav nincs: minden, ami a jatekban ki van rajzolva (START,
       varazspalca, hangszoro, palyavalaszto, FOLYTATAS, KILEPES), maga
       koppinthato. Lasd src/tapint.js. -->

  <!-- Allo telefonon. -->
  <div id="forgasd" role="dialog" aria-live="polite">
    <div class="ikon" aria-hidden="true"></div>
    <div><strong>Fordítsd el a telefont</strong><br>A játék fekve működik, két hüvelykujjal irányítható</div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
